<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Achtergrond: afgerond vierkant -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Klepbord-lichaam (wit) -->
  <rect x="5" y="15" width="22" height="13" rx="2.5" fill="white"/>

  <!-- Klepbord-bovenkant (wit) -->
  <rect x="5" y="8" width="22" height="8" rx="2" fill="white"/>

  <!-- Diagonale strepen op bovenkant (paars/roze) -->
  <clipPath id="clip">
    <rect x="5" y="8" width="22" height="8" rx="2"/>
  </clipPath>
  <g clip-path="url(#clip)">
    <line x1="5"  y1="16" x2="10" y2="8"  stroke="#7c3aed" stroke-width="3"/>
    <line x1="11" y1="16" x2="16" y2="8"  stroke="#7c3aed" stroke-width="3"/>
    <line x1="17" y1="16" x2="22" y2="8"  stroke="#7c3aed" stroke-width="3"/>
    <line x1="23" y1="16" x2="28" y2="8"  stroke="#7c3aed" stroke-width="3"/>
  </g>

  <!-- Play-driehoek (paars) in het wit lichaam -->
  <polygon points="13,18.5 13,25 22,21.5" fill="#7c3aed"/>
</svg>
